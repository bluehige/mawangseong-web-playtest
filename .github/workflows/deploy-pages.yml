name: Deploy latest QA build to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest QA build
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate latest Godot export
        shell: bash
        run: |
          test -f index.html
          test -f index.js
          test -f index.pck
          test -f index.wasm
          test -f build-version.txt
          test -f playtest-build.json
          test "$(stat -c '%s' index.pck)" -eq 242757652
          test "$(stat -c '%s' index.wasm)" -eq 38047590
          test "$(sha256sum index.pck | cut -d' ' -f1)" = "d76ffc00d8afe4874699ea5986d242353913b00b4b4d1397d97c82cfad79eea4"
          test "$(sha256sum index.wasm | cut -d' ' -f1)" = "6ead2ac528d007fe9627aae650444f9187f89420d7603c22460d8f3279545240"
          grep -Fq "v122-ui-s09-day2-overlay-playtest" build-version.txt
          grep -Fq '"source_base_commit": "321d56afe264488bb85593d2d1954b092d80532e"' playtest-build.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare latest Pages artifact
        shell: bash
        run: |
          mkdir _site
          cp index.html index.js index.pck index.wasm index.png \
            index.icon.png index.apple-touch-icon.png \
            index.audio.position.worklet.js index.audio.worklet.js \
            build-version.txt playtest-build.json .nojekyll _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
