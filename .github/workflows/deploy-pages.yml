name: Deploy latest QA build to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest QA build
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate latest Godot export
        shell: bash
        run: |
          test -f index.html
          test -f index.js
          test -f index.pck
          test -f index.wasm
          test -f build-version.txt
          test -f playtest-build.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare latest Pages artifact
        shell: bash
        run: |
          mkdir _site
          cp index.html index.js index.pck index.wasm index.png \
            index.icon.png index.apple-touch-icon.png \
            index.audio.position.worklet.js index.audio.worklet.js \
            build-version.txt playtest-build.json .nojekyll _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
